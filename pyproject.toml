[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phirsi"
version = "0.1.0"
description = "Bounded, reproducible research harness for verifiable systems improvement"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Phi369 Labs"}]
dependencies = []

[project.scripts]
phirsi = "phirsi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
