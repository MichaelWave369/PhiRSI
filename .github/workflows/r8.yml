name: R8 local PhiServe A/B protocol tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r8:
    name: Paired local HTTP fixture and no-authority validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Test R1–R8 including FAKE local PhiServe fixture
        run: python -m unittest discover -s tests -v
      - name: Show R8 commands without running real inference
        run: |
          python -m phirsi.model_pair_cli --help
          python -m phirsi.model_pair_cli plan --help
          python -m phirsi.model_pair_cli run --help
          python -m phirsi.model_pair_cli verify --help
      - name: Confirm no real model validation claim
        run: |
          python -c "from pathlib import Path; p=Path('docs/R8_PROTOCOL.md').read_text(); assert 'fake PhiServe HTTP server' in p and 'DESCRIPTIVE_ONLY_NO_WINNER' in p"
