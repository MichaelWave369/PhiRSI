name: R9 expanded local field evidence tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r9:
    name: Fake PhiServe, GGUF fingerprint and review-only receipt tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Full R1-R9 Python regression suite
        run: python -m unittest discover -s tests -v
      - name: CLI help smoke without any real inference
        run: |
          python -m phirsi.field_cli --help
          python -m phirsi.field_cli plan --help
          python -m phirsi.field_cli run --help
          python -m phirsi.field_cli verify --help
      - name: Assert explicit evidence limitations
        run: |
          python -c "from pathlib import Path; p=Path('docs/R9_PROTOCOL.md').read_text(); assert 'not from the same inference' in p and 'No real GGUF model' in p"
